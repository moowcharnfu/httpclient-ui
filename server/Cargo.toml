[package]
name = "httpclient-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "gzip", "deflate", "http2", "stream"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures-util = "0.3"
futures-executor = "0.3"
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 2
strip = true
lto = "thin"
