name: Build Desktop App

on:
  push:
    tags:
      - 'v*' # 触发标签或者分支

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            artifact: linux-installers
            macosDeploymentTarget: ''
            paths: |
              server/target/release/bundle/deb/*
              server/target/release/bundle/rpm/*
              server/target/release/bundle/appimage/*
          - platform: Windows
            os: windows-latest
            args: --bundles nsis,msi
            artifact: windows-installers
            macosDeploymentTarget: ''
            paths: |
              server/target/release/bundle/nsis/*.exe
              server/target/release/bundle/msi/*.msi
          - platform: macOS Intel
            os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
            artifact: macos-intel
            macosDeploymentTarget: '10.15'
            paths: |
              server/target/release/x86_64-apple-darwin/bundle/macos/*.app
              server/target/release/x86_64-apple-darwin/bundle/dmg/*.dmg
          - platform: macOS Apple Silicon
            os: macos-15
            args: --target aarch64-apple-darwin --bundles app,dmg
            artifact: macos-apple-silicon
            macosDeploymentTarget: '11.0'
            paths: |
              server/target/release/aarch64-apple-darwin/bundle/macos/*.app
              server/target/release/aarch64-apple-darwin/bundle/dmg/*.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf protobuf-compiler libfuse2 rpm

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosDeploymentTarget }}
        with:
          projectPath: server
          args: ${{ matrix.args }}
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('HTTP Test {0}', github.ref_name) || '' }}
          releaseBody: HTTP Test desktop installers built from ${{ github.ref_name }}.
          releaseDraft: true
          prerelease: false

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14�
